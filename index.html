<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Frame</title>
  <meta http-equiv="refresh" content="3600">
  <style>
    body { margin: 0; cursor: pointer; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #frame { position: relative; line-height: 0; }
    img { display: block; max-width: 100vw; max-height: 100vh; object-fit: contain; }
    #weather-box { position: absolute; top: 3%; left: 2%; line-height: normal; display: none; flex-direction: column; align-items: flex-start; gap: 6px;
      color: white; font-family: system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); }
    #weather { display: flex; align-items: center; gap: 12px;
      padding: 10px 22px 10px 14px; border-radius: 999px; background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      color: white; font-family: system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); direction: ltr; }
    #weather .icon { font-size: 48px; line-height: 1; }
    #weather .max { font-size: 36px; font-weight: 600; }
    #weather .min { font-size: 26px; opacity: 0.75; }
    #weather-compare { display: none; font-size: 20px; padding: 4px 14px; border-radius: 999px; background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); direction: rtl; }
  </style>
</head>
<body>
  <div id="frame">
    <img id="frame-img" alt="Today's family image">
    <div id="weather-box">
      <div id="weather"><span class="icon"></span><span class="max"></span><span class="min"></span></div>
      <div id="weather-compare"></div>
    </div>
  </div>
  <script>
    document.getElementById('frame-img').src = 'today.jpg?t=' + Date.now();
    // On the living-room tablet (Fully Kiosk), a tap opens the Home Assistant app
    document.body.addEventListener('click', () => {
      location.href = 'intent:#Intent;component=io.homeassistant.companion.android/.launch.LaunchActivity;end';
    });

    // Today's weather (Open-Meteo, no key). Coordinates rounded to the area, not the house.
    const WEATHER_ICONS = [
      [[0], '☀️'], [[1], '🌤️'], [[2], '⛅'], [[3], '☁️'],
      [[45, 48], '🌫️'], [[51, 53, 55, 56, 57, 61, 63, 65, 66, 67], '🌧️'],
      [[71, 73, 75, 77, 85, 86], '❄️'], [[80, 81, 82], '🌦️'], [[95, 96, 99], '⛈️'],
    ];
    // Compares today's max temperature with yesterday's, in °C
    function compareToYesterday(today, yesterday) {
      if (typeof today !== 'number' || typeof yesterday !== 'number') return '';
      const diff = today - yesterday;
      const size = Math.abs(diff);
      if (size < 1) return 'בערך כמו אתמול';
      const word = diff > 0 ? 'חם' : 'קר';
      if (size < 3) return `קצת יותר ${word} מאתמול`;
      if (size < 6) return `יותר ${word} מאתמול`;
      return `הרבה יותר ${word} מאתמול`;
    }
    function showWeather() {
      fetch('https://api.open-meteo.com/v1/forecast?latitude=31.9&longitude=35.0'
          + '&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Asia%2FJerusalem&past_days=1&forecast_days=1')
        .then(r => r.json())
        .then(data => {
          // past_days=1: index 0 is yesterday, index 1 is today
          const d = data.daily;
          const code = d.weathercode[1];
          const match = WEATHER_ICONS.find(([codes]) => codes.includes(code));
          const box = document.getElementById('weather');
          box.querySelector('.icon').textContent = match ? match[1] : '🌡️';
          box.querySelector('.max').textContent = Math.round(d.temperature_2m_max[1]) + '°';
          box.querySelector('.min').textContent = Math.round(d.temperature_2m_min[1]) + '°';
          const compare = compareToYesterday(d.temperature_2m_max[1], d.temperature_2m_max[0]);
          const compareBox = document.getElementById('weather-compare');
          compareBox.textContent = compare;
          compareBox.style.display = compare ? 'block' : 'none';
          document.getElementById('weather-box').style.display = 'flex';
        })
        .catch(() => setTimeout(showWeather, 5 * 60 * 1000));
    }
    showWeather();
  </script>
</body>
</html>
